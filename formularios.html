<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header style="background-color: #344b63; padding: 15px; text-align: center;">
        <nav>
            <a href="contacto.html">INICIO</a>
            <a href="tablas.html">INFORMACIÓN</a>
            <a href="formularios.html">CONTACTO</a>
            <a href="mapa.html">UBICACIÓN</a>
        </nav>
    </header>
        <h3>Formulario de Acceso</h3>
        <form method="get" name="formulario 1">
            <label>usuario</label>
            <input type="text" name="usuario" placeholder="Ingrese el usuario" size="15" maxlength="10" required><br>
            <label>clave</label>
            <input type="password" name="clave" placeholder="Ingrese a clave secreta">
            <div class="botones">
                <input type="submit" value="Aceptar" class="btn">
                <input type="reset" value="Cancelar" class="btn">
            </div>
        </form>
    </div>
    <div class="caja dos">
        <h3>Formulario de ingreso de datos</h3>
        <form method="get" name="formulario 2">
            <fieldset>
                <legend>Datos Personales</legend>
                <label>Nombre</label>
                <input type="text" name="nombre" placeholder="Nombres y Apellidos"><br>
                <label>email</label>
                <input type="email" name="correo" placeholder="correo"><br>
                <label>Telefono</label>
                <input type="tel" name="celular" placeholder="000000000" maxlength="9" size="9"><br>
            </fieldset>
            <fieldset>
                <legend>Otros Datos</legend>
                <label>Web</label>
                <input type="url" name="web" placeholder="http://www.dominio.com"><br>
                <label>Edad</label>
                <input type="number" name="edad" max="100" min="0" step="2"><br>
                <label>Fecha Nac</label>
                <input type="date" name="cumple"><br>
                <label>Comidas Favoritas:</label><br>
                <input type="checkbox" name="comida" id="m">Marinas
                <input type="checkbox" name="comida" id="p">Parrillas
                <input type="checkbox" name="comida" id="e"checked>Ensaladas
                <label>Genero:</label><br>
                <input type="radio" name="genero" value="H" checked>Masculino
                <input type="radio" name="genero" value="F">Femenino
                <input type="radio" name="genero" value="N">Ningunoz<br>
                <label>Comentario</label>
                <textarea name="comentario" cols="30" rows="10"></textarea>
            </fieldset>
            <div class="botones">
                <input type="submit" value="Aceptar" class="btn">
                <input type="reset" value="Cancelar" class="btn">
            </div>
        </form>
    </div>
</body>
</html>
